services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    ports:
      - "8080:8080"
    env_file: .env
    environment:

      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

      CASC_JENKINS_CONFIG: /var/jenkins_config/casc.yaml

      DB_URL: "jdbc:mysql://mysql:3306/${DB_NAME}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_config/casc.yaml:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: redesocial-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: db
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_smoke:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  app:
    build: .
    container_name: redesocial-app
    env_file: .env
    environment:
      PORT: 8080
      DB_URL: "jdbc:mysql://mysql:3306/db"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      CHAT_SERVER_PORT_BASE: 3000
      CHAT_ROOM_CAPACITY: 50
    depends_on:
      - mysql
    ports:
      - "8089:8080"
      - "3000-3005:3000-3005"
    restart: unless-stopped

volumes:
  jenkins_home:
  mysql_data:
  mysql_data_smoke:
